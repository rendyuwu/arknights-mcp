name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: lint + type + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # SPEC §C: CI runs on Linux/ubuntu-latest only (Docker -> OS-portable;
        # no macOS device -> cannot real-test).
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --locked --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check (mypy, strict)
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q --cov=arknights_mcp --cov-report=term-missing

  live-upstream:
    # SPEC §T68 / §T193 / §T204 / §T205 / §T208 / §C: real-corpus validation against LIVE
    # upstream. Needs network, so it is a dedicated Linux-only job gated by
    # ARKMCP_LIVE_UPSTREAM (the test modules skip themselves unless the flag is set).
    # Fetches a pinned arknights_assets_gamedata commit and asserts (a) real 4-4 combat
    # data after an import (§T68), (b) the §V97 token boundary over every real EN effect
    # template (§T193/B130), (c) §V109's zero-truncation template cap (§T204/B154),
    # (d) §V110's real event titles reaching the search service (§T205/B155) and (e) the
    # §V99 skill enum encoding arms (§T208/B157). The module list is enumerated, so a new
    # live guard is only guarded here once it is ADDED -- (c) and (d) were written but
    # never listed, and so never ran in CI at all. Nothing fetched is committed (§V16,
    # fetch -> discard).
    name: live-upstream real-corpus (§T68, §T193, §T204, §T205, §T208)
    runs-on: ubuntu-latest
    # Non-blocking: a flaky/unreachable/rate-limited upstream must not turn CI red
    # for unrelated changes. The job still runs and reports its own status; it just
    # does not fail the overall workflow. Promote to a hard gate if flakiness is low.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --locked --dev

      - name: Real-corpus validation vs live upstream
        env:
          ARKMCP_LIVE_UPSTREAM: "1"
          # §V56/§V61 official EN feed (the same endpoint config.example.toml and
          # config/data_sources.toml document). Supplied here rather than defaulted in
          # test code: there is deliberately no shipped default feed URL.
          ARKMCP_ANNOUNCE_FEED_URL: "https://ark-us-static-online.yo-star.com/announce/Android/announcement.meta.json"
        run: |
          uv run pytest \
            tests/contract/test_live_upstream.py \
            tests/contract/test_template_weld.py \
            tests/contract/test_template_truncation.py \
            tests/contract/test_zone_event_search.py \
            tests/contract/test_skill_enum_encoding.py -q

  cn-cross-validate:
    # SPEC §T69 / §C: CI-only kengxxiao_gamedata CN cross-validator. Fetches a
    # pinned kengxxiao CN enemy_database + the primary CN counterpart and asserts
    # shared enemy stats (maxHp/baseAttackTime/massLevel/motion) agree across the two
    # independent CN dumps (§V29). kengxxiao is never a runtime dep, never overrides
    # the primary source, and nothing fetched is committed (§V16, fetch -> discard).
    name: CN cross-validate (§T69)
    runs-on: ubuntu-latest
    # Non-blocking for the same reason as live-upstream: a flaky/unreachable/
    # rate-limited upstream (two of them here) must not turn CI red for unrelated
    # changes. The job still runs and reports its own status.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --locked --dev

      - name: CN cross-validation (kengxxiao vs primary)
        env:
          ARKMCP_KENGXXIAO_XVAL: "1"
        run: uv run pytest tests/contract/test_kengxxiao_cross_validate.py -q
